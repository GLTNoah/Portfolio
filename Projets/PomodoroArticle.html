<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Article</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../MediaQueries.css">
    <link rel="stylesheet" href="../KeyFrames.css">
    <link rel="stylesheet" href="../Projets.css"> 
    <link rel="stylesheet" href="Article.css"> 
    <link rel="stylesheet" href="MediaArticle.css">

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const donneesSauvegardees = localStorage.getItem('donnees-survie');
            if (donneesSauvegardees) {
                try {
                    const data = JSON.parse(donneesSauvegardees);
                    if (data.theme) document.body.dataset.theme = data.theme;
                    if (data.video) {
                        const fondVideo = document.querySelector('.fond-video');
                        if (fondVideo) fondVideo.src = "../" + data.video.substring(2);
                    }
                } catch (e) {}
            }

            let zoomFactor = 1;
            const root = document.documentElement;
            
            document.getElementById('btn-zoom-in').addEventListener('click', () => {
                if(zoomFactor < 1.6) {
                    zoomFactor += 0.1;
                    root.style.setProperty('--zoom-factor', zoomFactor);
                }
            });

            document.getElementById('btn-zoom-out').addEventListener('click', () => {
                if(zoomFactor > 0.8) {
                    zoomFactor -= 0.1;
                    root.style.setProperty('--zoom-factor', zoomFactor);
                }
            });

            let modeLecture = false;
            document.getElementById('btn-lecture').addEventListener('click', () => {
                modeLecture = !modeLecture;
                if(modeLecture) {
                    document.body.classList.add('lecture-pure');
                    document.getElementById('btn-lecture').textContent = "[X] MODE LECTURE";
                } else {
                    document.body.classList.remove('lecture-pure');
                    document.getElementById('btn-lecture').textContent = "[O] MODE LECTURE";
                }
            });

            document.getElementById('btn-print').addEventListener('click', () => {
                window.print();
            });

            document.getElementById('btn-top').addEventListener('click', () => {
                document.querySelector('.Document-Wrapper').scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
</head>
